name: test-desktop-vlc4-prebuilt

# Runs the shared test suite (Avalonia --autorun headless) on each desktop OS
# using the native libvlc 4.0 built by build-vlc4-prebuilt. Uploads VLC logs,
# snapshots and audio snippets for manual review.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Desktop OS to test"
        type: choice
        default: all
        options: [all, linux, windows, macos]
      build_run_id:
        description: "build-vlc4-prebuilt run id to pull binaries from (blank = latest successful)"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, family: linux }
          - { os: windows-latest, rid: win-x64,   family: windows }
          - { os: macos-14,       rid: osx-arm64, family: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Skip disabled family
        id: gate
        shell: bash
        run: |
          only="${{ inputs.only }}"
          if [ "$only" != "all" ] && [ "$only" != "${{ matrix.family }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build run id
        if: steps.gate.outputs.run == 'true'
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="${{ inputs.build_run_id }}"
          if [ -z "$rid" ]; then
            rid=$(gh run list --workflow build-vlc4-prebuilt.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "id=$rid" >> "$GITHUB_OUTPUT"
          echo "Using build run $rid"

      - name: Download native ${{ matrix.rid }}
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ steps.run.outputs.id }} -n vlc4-prebuilt-${{ matrix.rid }} -D native

      - name: Build Avalonia test app (VLC4)
        if: steps.gate.outputs.run == 'true'
        run: dotnet build Tests/VLCDotNet.Tests.Avalonia/VLCDotNet.Tests.Avalonia.csproj -c Release -p:VlcMajor=4

      - name: Stage native libvlc next to the app and run headless tests
        if: steps.gate.outputs.run == 'true'
        id: runtests
        continue-on-error: true
        shell: bash
        run: |
          out="Tests/VLCDotNet.Tests.Avalonia/bin/Release/net8.0"
          cp -a native/* "$out"/
          export VLC_PLUGIN_PATH="$out/plugins"
          case "${{ runner.os }}" in
            Linux)   export LD_LIBRARY_PATH="$PWD/$out:${LD_LIBRARY_PATH:-}";;
            macOS)   export DYLD_LIBRARY_PATH="$PWD/$out:${DYLD_LIBRARY_PATH:-}";;
          esac
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y gdb >/dev/null 2>&1 || true
            ulimit -c unlimited || true
            sudo sysctl -w kernel.core_pattern="$PWD/core.%p" >/dev/null 2>&1 || true
            export DOTNET_DbgEnableMiniDump=0
          fi
          set +e
          dotnet "$out/VLCDotNet.Tests.Avalonia.dll" --autorun
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "${{ runner.os }}" = "Linux" ] && [ "$code" -ge 128 ]; then
            echo "---- app exited with $code (native signal); capturing backtrace ----"
            core=$(ls -t core.* 2>/dev/null | head -1)
            command -v gdb >/dev/null 2>&1 || { sudo apt-get update -qq >/dev/null 2>&1 || true; sudo apt-get install -y gdb >/dev/null 2>&1 || true; }
            if [ -n "$core" ] && command -v gdb >/dev/null 2>&1; then
              gdb -batch -ex "bt" -ex "thread apply all bt" -ex quit "$(command -v dotnet)" "$core" 2>&1 | tail -n 160
            else
              echo "no core captured (core='$core'); gdb=$(command -v gdb); core_pattern=$(cat /proc/sys/kernel/core_pattern 2>/dev/null)"
            fi
          fi
          echo "---- vlc-log.txt (tail) ----"
          tail -n 40 "$out/test-output/vlc-log.txt" || true

      - name: Upload test artifacts
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: test-output-vlc4-prebuilt-${{ matrix.rid }}
          path: Tests/VLCDotNet.Tests.Avalonia/bin/Release/net8.0/test-output
          if-no-files-found: warn

      - name: Fail if tests failed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${{ steps.runtests.outputs.code }}" != "0" ]; then
            echo "::error::${{ steps.runtests.outputs.code }} test(s) failed"
            exit 1
          fi
          echo "All tests passed."
