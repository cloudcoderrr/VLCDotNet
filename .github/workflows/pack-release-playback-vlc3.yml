name: pack-release-playback-vlc3

# Downloads every playback native artifact from a build-playback-vlc3 run, packs
# the VLCDotNet3.Playback NuGet (managed bindings + all platform binaries, no
# encoders) and publishes it to a GitHub Release (tag vplay3-<version>). Runs on
# macOS so the iOS/Mac Catalyst heads can be built.
#
# Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "build-playback-vlc3 run id to pull binaries from (blank = latest successful)"
        required: false
      publish_release:
        description: "Create/update a GitHub Release with the package"
        type: boolean
        default: true
      allow_partial:
        description: "Pack even if some of the 17 RIDs are missing (validation only; do NOT publish a partial production package)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  pack:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode 26.0
        run: |
          for x in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app; do
            if [ -d "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              sudo xcode-select -s "$x/Contents/Developer"; echo "Selected $x"; break
            fi
          done
          xcodebuild -version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install mobile workloads
        run: dotnet workload install maui-android maui-ios maui-maccatalyst --version 10.0.100

      - name: Read VlcVersion
        id: ver
        run: |
          v=$(grep -oE '<VlcVersion>[^<]+' Directory.Build.props | sed 's/<VlcVersion>//')
          echo "vlc=$v" >> "$GITHUB_OUTPUT"
          echo "VLC version: $v"

      - name: Resolve package and release version
        id: rel
        run: |
          set -euo pipefail
          publish_release="${{ inputs.publish_release }}"
          base="${{ steps.ver.outputs.vlc }}"
          anchor_tag=""
          if [ "$publish_release" = "true" ]; then
            prefix="vplay3-${base}."
            git fetch --force --tags origin
            max_suffix=0
            for tag in $(git tag -l "${prefix}*"); do
              suffix="${tag#${prefix}}"
              case "$suffix" in ''|*[!0-9]*) continue ;; esac
              if [ "$suffix" -gt "$max_suffix" ]; then max_suffix="$suffix"; fi
            done
            next_suffix=$((max_suffix + 1))
            release_version="${base}.${next_suffix}"
            release_tag="vplay3-${release_version}"
            release_title="VLCDotNet3.Playback ${release_version}"
            if [ "$max_suffix" -gt 0 ]; then
              anchor_tag="${prefix}${max_suffix}"
            fi
          else
            release_version="$base"
            release_tag="vplay3-${base}"
            release_title="VLCDotNet3.Playback ${base}"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "title=$release_title" >> "$GITHUB_OUTPUT"
          echo "anchor=$anchor_tag" >> "$GITHUB_OUTPUT"

      - name: Resolve build run id
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="${{ inputs.build_run_id }}"
          [ -z "$rid" ] && rid=$(gh run list --workflow build-playback-vlc3.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "id=$rid" >> "$GITHUB_OUTPUT"
          echo "Using build run $rid"

      - name: Free disk space (macOS runner)
        run: |
          df -h / || true
          # The pack only BUILDS the managed library heads; it never runs
          # simulators, so iOS/tvOS/watchOS simulator runtimes and devices are
          # safe to remove and free several GB for the 17-RID artifact set + nupkg.
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Devices/* 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          sudo rm -rf ~/Library/Caches/* 2>/dev/null || true
          df -h / || true

      - name: Download all native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry up to 4 times: GitHub artifact storage can transiently time out.
          for attempt in 1 2 3 4; do
            gh run download ${{ steps.run.outputs.id }} -D artifacts_dl && break
            echo "download attempt $attempt failed; retrying in 20s" >&2
            sleep 20
          done

      - name: Stage artifacts/<rid>
        env:
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
        run: |
          set -e
          mkdir -p artifacts
          for d in artifacts_dl/vlc3play-native-*; do
            [ -d "$d" ] || continue
            rid=$(basename "$d" | sed 's/^vlc3play-native-//')
            # MOVE (not copy) so the ~2 GB download set is not duplicated on the
            # space-constrained macOS runner.
            rm -rf "artifacts/$rid"
            mv "$d" "artifacts/$rid"
            echo "staged $rid"
          done
          required=(
            win-x64 win-x86 win-arm64
            linux-x64 linux-x86 linux-arm linux-arm64
            osx-x64 osx-arm64
            maccatalyst-x64 maccatalyst-arm64
            ios-arm64 iossimulator-x64 iossimulator-arm64
            android-arm android-arm64 android-x64
          )
          missing=()
          for rid in "${required[@]}"; do
            [ -d "artifacts/$rid" ] || missing+=("$rid")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing native artifacts: ${missing[*]}" >&2
            if [ "$ALLOW_PARTIAL" = "true" ]; then
              echo "::warning::Packing a PARTIAL set (allow_partial=true). Do not publish this as the production package."
            else
              echo "Pass build_run_id from a successful consolidated build-playback-vlc3 run (only=all), or set allow_partial=true for validation." >&2
              exit 1
            fi
          fi
          ls -R artifacts | head -n 60

      - name: Strip native debug info (keep nupkg < 2 GiB)
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/llvm-mingw"
          mkdir -p "$tool_dir"
          curl -fSL --retry 3 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-macos-universal.tar.xz" \
            -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$tool_dir" --strip-components=1
          llvm_strip="$tool_dir/bin/llvm-strip"
          "$llvm_strip" --version
          before=$(du -sm artifacts | cut -f1)
          find artifacts \( -name '*.dylib' -o -path '*/VLCDotNet.framework/VLCDotNet' \) -type f -print0 \
            | while IFS= read -r -d '' f; do strip -S "$f" 2>/dev/null || true; done
          find artifacts -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.dll' \) -print0 \
            | while IFS= read -r -d '' f; do "$llvm_strip" --strip-debug "$f" 2>/dev/null || true; done
          after=$(du -sm artifacts | cut -f1)
          echo "artifacts: ${before} MB -> ${after} MB"

      - name: Pack VLCDotNet3.Playback
        run: dotnet pack PlaybackOnly/VLCDotNet.Playback.csproj -c Release -p:VlcMobileTargets=true -p:PackageVersion=${{ steps.rel.outputs.version }} -o out

      - uses: actions/upload-artifact@v6
        with:
          name: VLCDotNet3-Playback-nupkg
          path: out/*.nupkg

      - name: Generate GitHub release notes
        if: ${{ inputs.publish_release }}
        id: notes
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/vlc3-playback-release-notes.md"
          package_version="${{ steps.rel.outputs.version }}"
          vlc_version="${{ steps.ver.outputs.vlc }}"
          anchor_tag="${{ steps.rel.outputs.anchor }}"
          {
            echo "# VLCDotNet3.Playback ${package_version}"
            echo
            echo "Playback-only (encoder-free) VLCDotNet3 package for libvlc ${vlc_version}."
            echo "Decodes and plays every format; ships no software encoders (x264/x265/twolame removed from the native build)."
            echo
            echo "## Included runtimes"
            echo
            echo "- Windows: x64, x86, arm64"
            echo "- Linux: x64, x86, arm, arm64"
            echo "- macOS: x64, arm64"
            echo "- Mac Catalyst: x64, arm64"
            echo "- iOS: arm64, simulator x64, simulator arm64"
            echo "- Android: arm, arm64, x64"
            echo
            echo "## Changes"
            echo
          } > "$notes_file"
          if [ -n "$anchor_tag" ]; then
            commit_count=$(git rev-list --count "${anchor_tag}..HEAD")
            if [ "$commit_count" -gt 0 ]; then
              echo "Changes since ${anchor_tag}:" >> "$notes_file"
              echo >> "$notes_file"
              git log --no-merges --pretty='- %s (%h)' "${anchor_tag}..HEAD" >> "$notes_file"
            else
              echo "- Packaging refresh for the current libvlc ${vlc_version} playback asset set." >> "$notes_file"
            fi
          else
            echo "- Initial playback-only GitHub release in the ${vlc_version} series." >> "$notes_file"
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"
          cat "$notes_file"

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          title="${{ steps.rel.outputs.title }}"
          notes_file="${{ steps.notes.outputs.file }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.nupkg --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$tag" out/*.nupkg --title "$title" --notes-file "$notes_file" --prerelease
          fi
