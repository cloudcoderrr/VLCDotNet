name: views-test-mobile-vlc3

# Runs the VLCDotNet3.Playback view-package test suite on an Android emulator,
# an iOS simulator and a Mac Catalyst host via the MAUI app in AUTORUN mode.
# Native libvlc is delivered by the published VLCDotNet3.Playback NuGet
# (downloaded into a local folder feed), exactly as a real consumer gets it.

on:
  push:
    branches: [main, master]
    paths:
      - "Maui/**"
      - ".github/workflows/views-test-mobile-vlc3.yml"
      - ".github/scripts/run-android-views-tests.sh"
  workflow_dispatch:
    inputs:
      only:
        description: "Mobile platform to test"
        type: choice
        default: all
        options: [all, android, ios, catalyst]
      playback_tag:
        description: "VLCDotNet3.Playback release tag"
        required: false
        default: "vplay3-3.0.24.3"

permissions:
  contents: read

env:
  PLAYBACK_TAG: ${{ inputs.playback_tag || 'vplay3-3.0.24.3' }}

jobs:
  android:
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.100
      - name: Download VLCDotNet3.Playback into the local feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$PLAYBACK_TAG" --repo "${{ github.repository }}" --pattern '*.nupkg' -D Maui/.local-nuget
      - name: Build debug APK (AUTORUN)
        run: >
          dotnet build Maui/tests/VLCDotNet.ViewTests.Maui/VLCDotNet.ViewTests.Maui.csproj
          -f net10.0-android -c Debug
          -p:DefineConstants=AUTORUN -p:VlcMobileTargets=true
          -p:AndroidFastDeploymentType=None
          -p:EmbedAssembliesIntoApk=true
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 4096M
          force-avd-creation: true
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          script: bash .github/scripts/run-android-views-tests.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: views-mobile-android
          path: mobile-output/android
          if-no-files-found: warn

  ios:
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'ios' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.0
        run: |
          for x in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app; do
            if [ -d "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              sudo xcode-select -s "$x/Contents/Developer"; echo "Selected $x"; break
            fi
          done
          xcodebuild -version
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workloads
        run: dotnet workload install maui --version 10.0.100
      - name: Download VLCDotNet3.Playback into the local feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$PLAYBACK_TAG" --repo "${{ github.repository }}" --pattern '*.nupkg' -D Maui/.local-nuget
      - name: Build iOS simulator app (AUTORUN)
        run: >
          dotnet build Maui/tests/VLCDotNet.ViewTests.Maui/VLCDotNet.ViewTests.Maui.csproj
          -f net10.0-ios -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:DefineConstants=AUTORUN -p:VlcMobileTargets=true
      - name: Run on simulator
        shell: bash
        run: |
          set -euo pipefail
          set -x
          udid=$(xcrun simctl create vlcviewtest com.apple.CoreSimulator.SimDeviceType.iPhone-15)
          cleanup() { xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true; xcrun simctl delete "$udid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          app=$(find Maui/tests/VLCDotNet.ViewTests.Maui/bin/Debug/net10.0-ios -name '*.app' -maxdepth 2 | head -1)
          test -n "$app"
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.vlcdotnet.viewtests
          container=$(xcrun simctl get_app_container "$udid" com.vlcdotnet.viewtests data)
          done_path=""
          for i in $(seq 1 90); do
            if [ -f "$container/Library/test-output/DONE.txt" ]; then done_path="$container/Library/test-output/DONE.txt"; break; fi
            if [ -f "$container/Documents/test-output/DONE.txt" ]; then done_path="$container/Documents/test-output/DONE.txt"; break; fi
            sleep 5
          done
          mkdir -p mobile-output/ios
          if [ -d "$container/Documents/test-output" ]; then cp -R "$container/Documents/test-output" mobile-output/ios/; elif [ -d "$container/Library/test-output" ]; then cp -R "$container/Library/test-output" mobile-output/ios/; fi
          if [ -z "$done_path" ]; then echo "iOS test app never produced DONE.txt" >&2; exit 1; fi
          failures=$(head -n 1 "$done_path" | tr -d '\r')
          case "$failures" in ''|*[!0-9]*) echo "Unexpected DONE.txt contents" >&2; exit 1;; esac
          tail -n 40 mobile-output/ios/test-output/runner-report.txt || true
          tail -n 30 mobile-output/ios/test-output/vlc-log.txt || true
          if [ "$failures" -ne 0 ]; then echo "iOS view-test suite reported $failures failure(s)." >&2; exit 1; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: views-mobile-ios
          path: mobile-output/ios
          if-no-files-found: warn

  catalyst:
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'catalyst' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.0
        run: |
          for x in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app; do
            if [ -d "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              sudo xcode-select -s "$x/Contents/Developer"; echo "Selected $x"; break
            fi
          done
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workloads
        run: dotnet workload install maui --version 10.0.100
      - name: Download VLCDotNet3.Playback into the local feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$PLAYBACK_TAG" --repo "${{ github.repository }}" --pattern '*.nupkg' -D Maui/.local-nuget
      - name: Build Mac Catalyst app (AUTORUN)
        run: >
          dotnet build Maui/tests/VLCDotNet.ViewTests.Maui/VLCDotNet.ViewTests.Maui.csproj
          -f net10.0-maccatalyst -c Debug
          -p:RuntimeIdentifier=maccatalyst-arm64
          -p:DefineConstants=AUTORUN -p:VlcMobileTargets=true
      - name: Run Mac Catalyst app
        shell: bash
        run: |
          set -euo pipefail
          set -x
          container="$HOME/Library/Containers/com.vlcdotnet.viewtests/Data"
          output_dir="$container/test-output"
          rm -rf "$HOME/Library/Containers/com.vlcdotnet.viewtests" || true
          mkdir -p mobile-output/catalyst
          app=$(find Maui/tests/VLCDotNet.ViewTests.Maui/bin/Debug/net10.0-maccatalyst -name '*.app' -maxdepth 3 | head -1)
          test -n "$app"
          exe=$(find "$app/Contents/MacOS" -maxdepth 1 -type f | head -1)
          test -n "$exe"
          VLCDOTNET_TEST_OUTPUT="$output_dir" "$exe" > mobile-output/catalyst/app-stdout.txt 2>&1 &
          app_pid=$!
          done_path=""
          for i in $(seq 1 90); do
            if [ -f "$output_dir/DONE.txt" ]; then done_path="$output_dir/DONE.txt"; break; fi
            done_path=$(find "$container" -path '*test-output/DONE.txt' -print -quit 2>/dev/null || true)
            if [ -n "$done_path" ]; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 5
          done
          if [ -n "$done_path" ]; then cp -R "$(dirname "$done_path")" mobile-output/catalyst/test-output; fi
          kill "$app_pid" 2>/dev/null || true
          if [ -z "$done_path" ]; then echo "Mac Catalyst app never produced DONE.txt" >&2; cat mobile-output/catalyst/app-stdout.txt || true; exit 1; fi
          failures=$(head -n 1 "$done_path" | tr -d '\r')
          case "$failures" in ''|*[!0-9]*) echo "Unexpected DONE.txt contents" >&2; exit 1;; esac
          tail -n 40 mobile-output/catalyst/test-output/runner-report.txt || true
          if [ "$failures" -ne 0 ]; then echo "Mac Catalyst view-test suite reported $failures failure(s)." >&2; exit 1; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: views-mobile-catalyst
          path: mobile-output/catalyst
          if-no-files-found: warn
