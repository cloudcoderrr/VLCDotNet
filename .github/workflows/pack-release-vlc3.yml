name: pack-release-vlc3

# Downloads every native artifact from a build-vlc3 run, packs the VLCDotNet3
# NuGet (managed bindings + all platform binaries) and publishes it to a GitHub
# Release. Runs on macOS so the iOS/Mac Catalyst heads can be built.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "build-vlc3 run id to pull binaries from (blank = latest successful)"
        required: false
      publish_release:
        description: "Create/update a GitHub Release with the package"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  pack:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode 26.0
        run: |
          # net10 iOS/Catalyst (Microsoft.iOS.Sdk 26.0.x) pins to Xcode 26.0.x;
          # pick the first whose macOS SDK actually exists (a stub 26.0 lacks it).
          for x in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app; do
            if [ -d "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              sudo xcode-select -s "$x/Contents/Developer"; echo "Selected $x"; break
            fi
          done
          xcodebuild -version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install mobile workloads
        run: dotnet workload install maui-android maui-ios maui-maccatalyst --version 10.0.100

      - name: Read VlcVersion
        id: ver
        run: |
          v=$(grep -oE '<VlcVersion>[^<]+' Directory.Build.props | sed 's/<VlcVersion>//')
          echo "vlc=$v" >> "$GITHUB_OUTPUT"
          echo "VLC version: $v"

      - name: Resolve package and release version
        id: rel
        run: |
          set -euo pipefail

          publish_release="${{ inputs.publish_release }}"
          base="${{ steps.ver.outputs.vlc }}"
          anchor_tag=""

          if [ "$publish_release" = "true" ]; then
            prefix="v${base}."

            git fetch --force --tags origin

            max_suffix=0
            for tag in $(git tag -l "${prefix}*"); do
              suffix="${tag#${prefix}}"
              case "$suffix" in
                ''|*[!0-9]*) continue ;;
              esac

              if [ "$suffix" -gt "$max_suffix" ]; then
                max_suffix="$suffix"
              fi
            done

            next_suffix=$((max_suffix + 1))
            release_version="${base}.${next_suffix}"
            release_tag="v${release_version}"
            release_title="VLCDotNet3 ${release_version}"

            if [ "$max_suffix" -gt 0 ]; then
              anchor_tag="${prefix}${max_suffix}"
            elif git rev-parse "refs/tags/v${base}" >/dev/null 2>&1; then
              anchor_tag="v${base}"
            fi
          else
            release_version="$base"
            release_tag="v${base}"
            release_title="VLCDotNet3 ${base}"
          fi

          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "title=$release_title" >> "$GITHUB_OUTPUT"
          echo "anchor=$anchor_tag" >> "$GITHUB_OUTPUT"

          echo "Release version: $release_version"
          if [ -n "$anchor_tag" ]; then
            echo "Changes anchor: $anchor_tag"
          else
            echo "Changes anchor: none"
          fi

      - name: Resolve build run id
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="${{ inputs.build_run_id }}"
          [ -z "$rid" ] && rid=$(gh run list --workflow build-vlc3.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "id=$rid" >> "$GITHUB_OUTPUT"
          echo "Using build run $rid"

      - name: Download all native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ steps.run.outputs.id }} -D artifacts_dl

      - name: Stage artifacts/<rid>
        run: |
          set -e
          for d in artifacts_dl/vlc3-*; do
            [ -d "$d" ] || continue
            rid=$(basename "$d" | sed 's/^vlc3-//')
            mkdir -p "artifacts/$rid"
            cp -a "$d"/. "artifacts/$rid/"
            echo "staged $rid"
          done
          required=(
            win-x64 win-arm64
            linux-x64 linux-arm linux-arm64
            osx-x64 osx-arm64
            maccatalyst-x64 maccatalyst-arm64
            ios-arm64 iossimulator-x64 iossimulator-arm64
            android-arm android-arm64 android-x64
          )
          missing=()
          for rid in "${required[@]}"; do
            [ -d "artifacts/$rid" ] || missing+=("$rid")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required native artifacts: ${missing[*]}" >&2
            echo "Pass build_run_id from a successful consolidated build-vlc3 run before packing." >&2
            exit 1
          fi
          ls -R artifacts | head -n 60

      - name: Pack VLCDotNet3
        run: dotnet pack src/VLCDotNet/VLCDotNet.csproj -c Release -p:VlcMobileTargets=true -p:PackageVersion=${{ steps.rel.outputs.version }} -o out

      - uses: actions/upload-artifact@v6
        with:
          name: VLCDotNet3-nupkg
          path: out/*.nupkg

      - name: Generate GitHub release notes
        if: ${{ inputs.publish_release }}
        id: notes
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/vlc3-release-notes.md"
          package_version="${{ steps.rel.outputs.version }}"
          vlc_version="${{ steps.ver.outputs.vlc }}"
          anchor_tag="${{ steps.rel.outputs.anchor }}"

          {
            echo "# VLCDotNet3 ${package_version}"
            echo
            echo "Prerelease refresh of the VLCDotNet3 package for libvlc ${vlc_version}."
            echo
            echo "## Included runtimes"
            echo
            echo "- Windows: x64, arm64"
            echo "- Linux: x64, arm, arm64"
            echo "- macOS: x64, arm64"
            echo "- Mac Catalyst: x64, arm64"
            echo "- iOS: arm64, simulator x64, simulator arm64"
            echo "- Android: arm, arm64, x64"
            echo
            echo "## Package"
            echo
            echo "- NuGet package: VLCDotNet3 ${package_version}"
            echo "- Native binaries: pulled from a successful build-vlc3 workflow artifact set"
            echo
            echo "## Changes"
            echo
          } > "$notes_file"

          if [ -n "$anchor_tag" ]; then
            commit_count=$(git rev-list --count "${anchor_tag}..HEAD")
            if [ "$commit_count" -gt 0 ]; then
              echo "Changes since ${anchor_tag}:" >> "$notes_file"
              echo >> "$notes_file"
              git log --no-merges --pretty='- %s (%h)' "${anchor_tag}..HEAD" >> "$notes_file"
            else
              echo "- Packaging refresh for the current libvlc ${vlc_version} asset set." >> "$notes_file"
            fi
          else
            echo "- Initial GitHub prerelease in the ${vlc_version} series." >> "$notes_file"
            echo "- Packaging refresh for the current repository state." >> "$notes_file"
          fi

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"
          cat "$notes_file"

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          title="${{ steps.rel.outputs.title }}"
          notes_file="${{ steps.notes.outputs.file }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.nupkg --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$tag" out/*.nupkg --title "$title" --notes-file "$notes_file" --prerelease
          fi
