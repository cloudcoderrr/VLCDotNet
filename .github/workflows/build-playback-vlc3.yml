name: build-playback-vlc3

# Phase 2 of the PLAYBACK-ONLY native build pipeline (VLC_PROFILE=playback).
# Builds encoder-free libvlc 3.0.x for every platform by RESTORING the playback
# contrib set committed to contribs/vlc-3.0-playback/<rid>/ by
# contribs-playback-vlc3, then linking libvlc against it. Uploads one artifact
# per RID (vlc3play-native-<rid>). Run contribs-playback-vlc3 for a family first.
#
# Manual dispatch only (these builds are long and expensive).

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Platform family to build"
        type: choice
        default: all
        options: [all, windows, linux, apple, android]
      rids:
        description: "Optional comma-separated RID allowlist (e.g. linux-x64). Blank = all in family."
        required: false

concurrency:
  group: build-playback-vlc3-${{ github.ref }}-${{ inputs.only || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VLC_VERSION: "3.0.24"
  VLC_SERIES: "3"
  VLC_PROFILE: "playback"

jobs:
  linux:
    if: ${{ inputs.only == 'all' || inputs.only == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  rid: linux-x64,   emulated: false, platform: "" }
          - { arch: i686,    rid: linux-x86,   emulated: false, platform: "" }
          - { arch: aarch64, rid: linux-arm64, emulated: true,  platform: "linux/arm64" }
          - { arch: armv7,   rid: linux-arm,   emulated: true,  platform: "linux/arm/v7" }
    steps:
      - uses: actions/checkout@v5
      - name: Gate RID
        id: f
        shell: bash
        env: { ALLOW: "${{ inputs.rids }}", RID: "${{ matrix.rid }}" }
        run: |
          run=true
          if [ -n "$ALLOW" ]; then case ",$ALLOW," in *",$RID,"*) run=true ;; *) run=false ;; esac; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Build libvlc (native ${{ matrix.arch }})
        if: ${{ steps.f.outputs.run == 'true' && !matrix.emulated }}
        run: |
          if [ "${{ matrix.arch }}" != "i686" ]; then sudo bash build/deps-linux.sh; fi
          bash build/build-linux.sh ${{ matrix.arch }}
      - name: Set up QEMU
        if: ${{ steps.f.outputs.run == 'true' && matrix.emulated }}
        uses: docker/setup-qemu-action@v3
      - name: Build libvlc (emulated ${{ matrix.arch }})
        if: ${{ steps.f.outputs.run == 'true' && matrix.emulated }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -e VLC_VERSION -e VLC_SERIES -e VLC_PROFILE \
            -v "$PWD:/work" -w /work ubuntu:22.04 \
            bash -c 'set -e; bash build/deps-linux.sh && bash build/build-linux.sh ${{ matrix.arch }}'
      - uses: actions/upload-artifact@v6
        if: ${{ steps.f.outputs.run == 'true' }}
        with:
          name: vlc3play-native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  windows:
    if: ${{ inputs.only == 'all' || inputs.only == 'windows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  rid: win-x64 }
          - { arch: i686,    rid: win-x86 }
          - { arch: aarch64, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: Gate RID
        id: f
        shell: bash
        env: { ALLOW: "${{ inputs.rids }}", RID: "${{ matrix.rid }}" }
        run: |
          run=true
          if [ -n "$ALLOW" ]; then case ",$ALLOW," in *",$RID,"*) run=true ;; *) run=false ;; esac; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Install cross build dependencies
        if: steps.f.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autopoint libtool-bin pkg-config gettext \
            git bison flex nasm yasm cmake ninja-build meson zip p7zip-full \
            gperf help2man dos2unix curl xz-utils zstd file
      - name: Build libvlc (${{ matrix.arch }})
        if: steps.f.outputs.run == 'true'
        run: bash build/build-windows.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        if: steps.f.outputs.run == 'true'
        with:
          name: vlc3play-native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  android:
    if: ${{ inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, rid: android-x64 }
          - { arch: arm64,  rid: android-arm64 }
          - { arch: arm,    rid: android-arm }
    steps:
      - uses: actions/checkout@v5
      - name: Gate RID
        id: f
        shell: bash
        env: { ALLOW: "${{ inputs.rids }}", RID: "${{ matrix.rid }}" }
        run: |
          run=true
          if [ -n "$ALLOW" ]; then case ",$ALLOW," in *",$RID,"*) run=true ;; *) run=false ;; esac; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        if: steps.f.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autopoint libtool-bin pkg-config gettext \
            git bison flex nasm yasm cmake ninja-build meson curl xz-utils zstd unzip \
            gperf help2man
      - name: Resolve Android NDK
        if: steps.f.outputs.run == 'true'
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - name: Build libvlc (${{ matrix.arch }})
        if: steps.f.outputs.run == 'true'
        run: bash build/build-android.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        if: steps.f.outputs.run == 'true'
        with:
          name: vlc3play-native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  apple:
    if: ${{ inputs.only == 'all' || inputs.only == 'apple' }}
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos,        arch: x86_64, rid: osx-x64 }
          - { platform: macos,        arch: arm64,  rid: osx-arm64 }
          - { platform: maccatalyst,  arch: x86_64, rid: maccatalyst-x64 }
          - { platform: maccatalyst,  arch: arm64,  rid: maccatalyst-arm64 }
          - { platform: ios,          arch: arm64,  rid: ios-arm64 }
          - { platform: iossimulator, arch: x86_64, rid: iossimulator-x64 }
          - { platform: iossimulator, arch: arm64,  rid: iossimulator-arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: Gate RID
        id: f
        shell: bash
        env: { ALLOW: "${{ inputs.rids }}", RID: "${{ matrix.rid }}" }
        run: |
          run=true
          if [ -n "$ALLOW" ]; then case ",$ALLOW," in *",$RID,"*) run=true ;; *) run=false ;; esac; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        if: steps.f.outputs.run == 'true'
        run: |
          brew install automake libtool pkg-config nasm yasm meson ninja gettext bison flex gperf help2man zstd || true
          PY_USER_BIN="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts", "posix_user"))')"
          python3 -m pip install --user --break-system-packages 'cmake<3.29'
          export PATH="$PY_USER_BIN:$PATH"
          cmake --version
          echo "$PY_USER_BIN" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/gettext/bin:/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"
      - name: Build libvlc (${{ matrix.platform }}/${{ matrix.arch }})
        if: steps.f.outputs.run == 'true'
        run: bash build/build-apple.sh ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        if: steps.f.outputs.run == 'true'
        with:
          name: vlc3play-native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
