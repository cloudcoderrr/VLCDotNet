name: test-mobile-vlc3

# Runs the shared test suite on an Android emulator and an iOS simulator via the
# MAUI app's AUTORUN mode. Requires the corresponding native binaries from
# build-vlc3 (android-*, iossimulator-*). This is finalized once those from-source
# mobile builds are green.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Mobile platform to test"
        type: choice
        default: all
        options: [all, android, ios, catalyst]
      build_run_id:
        description: "build-vlc3 run id to pull binaries from (blank = latest successful)"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  android:
    if: ${{ inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.100

      - name: Resolve build run id
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="${{ inputs.build_run_id }}"
          [ -z "$rid" ] && rid=$(gh run list --workflow build-vlc3.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "id=$rid" >> "$GITHUB_OUTPUT"

      - name: Download native android-x64
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ steps.run.outputs.id }} -n vlc3-android-x64 -D Tests/VLCDotNet.Tests.Maui/native/android-x64

      - name: Build debug APK (AUTORUN)
        run: >
          dotnet build Tests/VLCDotNet.Tests.Maui/VLCDotNet.Tests.Maui.csproj
          -f net10.0-android -c Debug
          -p:DefineConstants=AUTORUN -p:VlcMobileTargets=true
          -p:AndroidFastDeploymentType=None
          -p:EmbedAssembliesIntoApk=true
          -p:AndroidUseSharedRuntime=false

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 4096M
          force-avd-creation: true
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          script: bash .github/scripts/run-android-maui-tests.sh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-output-android
          path: mobile-output/android
          if-no-files-found: warn

  ios:
    if: ${{ inputs.only == 'all' || inputs.only == 'ios' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.0
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          # .NET 10 for iOS (Microsoft.iOS.Sdk 26.0.x) pins to Xcode 26.0.x. Some
          # runner images ship a stub Xcode_26.0.app missing the macOS SDK, so pick
          # the first 26.0.x whose macOS SDK actually exists.
          for x in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app; do
            if [ -d "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              sudo xcode-select -s "$x/Contents/Developer"; echo "Selected $x"; break
            fi
          done
          xcodebuild -version
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workloads
        # macOS builds every mobile head (android+ios+maccatalyst) during restore,
        # so all three workloads are required even though we only build the iOS TFM.
        run: dotnet workload install maui --version 10.0.100

      - name: Resolve build run id
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="${{ inputs.build_run_id }}"
          [ -z "$rid" ] && rid=$(gh run list --workflow build-vlc3.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "id=$rid" >> "$GITHUB_OUTPUT"

      - name: Download native iossimulator-arm64
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ steps.run.outputs.id }} -n vlc3-iossimulator-arm64 -D Tests/VLCDotNet.Tests.Maui/native/iossimulator-arm64

      - name: Build iOS simulator app (AUTORUN)
        run: >
          dotnet build Tests/VLCDotNet.Tests.Maui/VLCDotNet.Tests.Maui.csproj
          -f net10.0-ios -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:DefineConstants=AUTORUN -p:VlcMobileTargets=true

      - name: Run on simulator
        shell: bash
        run: |
          set -euo pipefail
          set -x
          udid=$(xcrun simctl create vlctest com.apple.CoreSimulator.SimDeviceType.iPhone-15)
          cleanup() {
            xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
            xcrun simctl delete "$udid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          app=$(find Tests/VLCDotNet.Tests.Maui/bin/Debug/net10.0-ios -name '*.app' -maxdepth 2 | head -1)
          test -n "$app"
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.vlcdotnet.tests
          container=$(xcrun simctl get_app_container "$udid" com.vlcdotnet.tests data)
          done_path=""
          for i in $(seq 1 90); do
            if [ -f "$container/Library/test-output/DONE.txt" ]; then
              done_path="$container/Library/test-output/DONE.txt"
              break
            fi
            if [ -f "$container/Documents/test-output/DONE.txt" ]; then
              done_path="$container/Documents/test-output/DONE.txt"
              break
            fi
            sleep 5
          done
          mkdir -p mobile-output/ios
          if [ -d "$container/Documents/test-output" ]; then
            cp -R "$container/Documents/test-output" mobile-output/ios/
          elif [ -d "$container/Library/test-output" ]; then
            cp -R "$container/Library/test-output" mobile-output/ios/
          fi
          if [ -z "$done_path" ]; then
            echo "iOS test app never produced DONE.txt" >&2
            exit 1
          fi
          done_contents=$(cat "$done_path")
          printf '%s\n' "$done_contents"
          failures=$(printf '%s\n' "$done_contents" | head -n 1 | tr -d '\r')
          case "$failures" in
            ''|*[!0-9]*)
              echo "Unexpected DONE.txt contents; expected numeric failure count on line 1." >&2
              exit 1
              ;;
          esac
          tail -n 40 mobile-output/ios/test-output/runner-report.txt || true
          tail -n 40 mobile-output/ios/test-output/vlc-log.txt || true
          if [ "$failures" -ne 0 ]; then
            echo "iOS test suite reported $failures failure(s)." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-output-ios
          path: mobile-output/ios
          if-no-files-found: warn

  catalyst:
    if: ${{ inputs.only == 'all' || inputs.only == 'catalyst' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.0
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          for x in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app; do
            if [ -d "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              sudo xcode-select -s "$x/Contents/Developer"; echo "Selected $x"; break
            fi
          done
          xcodebuild -version
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workloads
        run: dotnet workload install maui --version 10.0.100

      - name: Resolve build run id
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="${{ inputs.build_run_id }}"
          [ -z "$rid" ] && rid=$(gh run list --workflow build-vlc3.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "id=$rid" >> "$GITHUB_OUTPUT"

      - name: Download native maccatalyst-arm64
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ steps.run.outputs.id }} -n vlc3-maccatalyst-arm64 -D Tests/VLCDotNet.Tests.Maui/native/maccatalyst-arm64

      - name: Build Mac Catalyst app (AUTORUN)
        run: >
          dotnet build Tests/VLCDotNet.Tests.Maui/VLCDotNet.Tests.Maui.csproj
          -f net10.0-maccatalyst -c Debug
          -p:RuntimeIdentifier=maccatalyst-arm64
          -p:DefineConstants=AUTORUN -p:VlcMobileTargets=true

      - name: Run Mac Catalyst app
        shell: bash
        run: |
          set -euo pipefail
          set -x
          rm -rf "$HOME/Library/Containers/com.vlcdotnet.tests" || true
          mkdir -p mobile-output/catalyst
          app=$(find Tests/VLCDotNet.Tests.Maui/bin/Debug/net10.0-maccatalyst -name '*.app' -maxdepth 3 | head -1)
          test -n "$app"
          exe=$(find "$app/Contents/MacOS" -maxdepth 1 -type f | head -1)
          test -n "$exe"
          "$exe" > mobile-output/catalyst/app-stdout.txt 2>&1 &
          app_pid=$!
          container="$HOME/Library/Containers/com.vlcdotnet.tests/Data"
          done_path=""
          for i in $(seq 1 90); do
            done_path=$(find "$container" -path '*test-output/DONE.txt' -print -quit 2>/dev/null || true)
            if [ -n "$done_path" ]; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          if [ -n "$done_path" ]; then
            out_dir=$(dirname "$done_path")
            cp -R "$out_dir" mobile-output/catalyst/test-output
          elif [ -d "$container" ]; then
            find "$container" -maxdepth 6 -type f | sort > mobile-output/catalyst/container-files.txt || true
          fi
          if [ -z "$done_path" ]; then
            echo "Mac Catalyst test app never produced DONE.txt" >&2
            cat mobile-output/catalyst/app-stdout.txt || true
            ps -p "$app_pid" -o pid=,command= || true
            find "$HOME/Library/Containers/com.vlcdotnet.tests" -maxdepth 6 -type f 2>/dev/null | sort || true
            exit 1
          fi
          done_contents=$(cat "$done_path")
          printf '%s\n' "$done_contents"
          failures=$(printf '%s\n' "$done_contents" | head -n 1 | tr -d '\r')
          case "$failures" in
            ''|*[!0-9]*)
              echo "Unexpected DONE.txt contents; expected numeric failure count on line 1." >&2
              exit 1
              ;;
          esac
          tail -n 40 mobile-output/catalyst/test-output/runner-report.txt || true
          tail -n 40 mobile-output/catalyst/test-output/vlc-log.txt || true
          kill "$app_pid" >/dev/null 2>&1 || true
          wait "$app_pid" >/dev/null 2>&1 || true
          if [ "$failures" -ne 0 ]; then
            echo "Mac Catalyst test suite reported $failures failure(s)." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-output-catalyst
          path: mobile-output/catalyst
          if-no-files-found: warn
