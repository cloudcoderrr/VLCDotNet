name: test-mobile-vlc3

# Runs the shared test suite on an Android emulator and an iOS simulator via the
# MAUI app's AUTORUN mode. Requires the corresponding native binaries from
# build-vlc3 (android-*, iossimulator-*). This is finalized once those from-source
# mobile builds are green.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Mobile platform to test"
        type: choice
        default: all
        options: [all, android, ios]
      build_run_id:
        description: "build-vlc3 run id to pull binaries from (blank = latest successful)"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  android:
    if: ${{ inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.100

      - name: Resolve build run id
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="${{ inputs.build_run_id }}"
          [ -z "$rid" ] && rid=$(gh run list --workflow build-vlc3.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "id=$rid" >> "$GITHUB_OUTPUT"

      - name: Download native android-x64
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ steps.run.outputs.id }} -n vlc3-android-x64 -D Tests/VLCDotNet.Tests.Maui/native/android-x64

      - name: Build debug APK (AUTORUN)
        run: >
          dotnet build Tests/VLCDotNet.Tests.Maui/VLCDotNet.Tests.Maui.csproj
          -f net10.0-android -c Debug
          -p:DefineConstants=AUTORUN -p:VlcMobileTargets=true

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 4096M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          script: |
            set -x
            adb wait-for-device
            # Wait for full boot before touching the package manager.
            adb shell 'while [ "$(getprop sys.boot_completed 2>/dev/null)" != "1" ]; do sleep 2; done'
            adb logcat -c || true
            apk=$(find Tests/VLCDotNet.Tests.Maui/bin/Debug/net10.0-android -name '*-Signed.apk' 2>/dev/null | head -1)
            [ -z "$apk" ] && apk=$(find Tests/VLCDotNet.Tests.Maui/bin -name '*.apk' 2>/dev/null | head -1)
            echo "APK: '$apk'"
            ls -la Tests/VLCDotNet.Tests.Maui/bin/Debug/net10.0-android/ 2>/dev/null || true
            test -n "$apk"
            echo "Installing $apk"
            adb install -r "$apk"
            adb shell monkey -p com.vlcdotnet.tests -c android.intent.category.LAUNCHER 1
            done=""
            for i in $(seq 1 120); do
              if adb shell run-as com.vlcdotnet.tests cat files/test-output/DONE.txt 2>/dev/null; then done=1; break; fi
              sleep 5
            done
            mkdir -p mobile-output/android
            adb exec-out run-as com.vlcdotnet.tests tar c -C files test-output 2>/dev/null | tar x -C mobile-output/android || true
            echo "---- vlc-log tail ----"; tail -n 60 mobile-output/android/test-output/vlc-log.txt || true
            echo "---- logcat (vlc/mono/crash) ----"; adb logcat -d 2>/dev/null | grep -iE 'vlcdotnet|libvlc|mono-rt|AndroidRuntime|FATAL|DOTNET' | tail -n 80 || true
            test -n "$done"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-output-android
          path: mobile-output/android
          if-no-files-found: warn

  ios:
    if: ${{ inputs.only == 'all' || inputs.only == 'ios' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.0
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          # .NET 10 for iOS (Microsoft.iOS.Sdk 26.0.x) pins to Xcode 26.0.x. Some
          # runner images ship a stub Xcode_26.0.app missing the macOS SDK, so pick
          # the first 26.0.x whose macOS SDK actually exists.
          for x in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app; do
            if [ -d "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              sudo xcode-select -s "$x/Contents/Developer"; echo "Selected $x"; break
            fi
          done
          xcodebuild -version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workloads
        # macOS builds every mobile head (android+ios+maccatalyst) during restore,
        # so all three workloads are required even though we only build the iOS TFM.
        run: dotnet workload install maui --version 10.0.100

      - name: Resolve build run id
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="${{ inputs.build_run_id }}"
          [ -z "$rid" ] && rid=$(gh run list --workflow build-vlc3.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "id=$rid" >> "$GITHUB_OUTPUT"

      - name: Download native iossimulator-arm64
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ steps.run.outputs.id }} -n vlc3-iossimulator-arm64 -D Tests/VLCDotNet.Tests.Maui/native/iossimulator-arm64

      - name: Build iOS simulator app (AUTORUN)
        run: >
          dotnet build Tests/VLCDotNet.Tests.Maui/VLCDotNet.Tests.Maui.csproj
          -f net10.0-ios -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:DefineConstants=AUTORUN -p:VlcMobileTargets=true

      - name: Run on simulator
        run: |
          set -x
          dev=$(xcrun simctl create vlctest com.apple.CoreSimulator.SimDeviceType.iPhone-15 || true)
          udid=$(xcrun simctl list devices booted -j | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((x['udid'] for v in d['devices'].values() for x in v if x['state']=='Booted'),''))" || true)
          xcrun simctl boot vlctest || true
          app=$(find Tests/VLCDotNet.Tests.Maui/bin/Debug/net10.0-ios -name '*.app' -maxdepth 2 | head -1)
          xcrun simctl install booted "$app"
          xcrun simctl launch booted com.vlcdotnet.tests
          container=$(xcrun simctl get_app_container booted com.vlcdotnet.tests data)
          for i in $(seq 1 90); do
            [ -f "$container/Documents/../Library/test-output/DONE.txt" ] && break || true
            [ -f "$container/Documents/test-output/DONE.txt" ] && break || true
            sleep 5
          done
          mkdir -p mobile-output/ios
          cp -R "$container"/Documents/test-output mobile-output/ios/ 2>/dev/null || \
            cp -R "$container"/Library/test-output mobile-output/ios/ 2>/dev/null || true
          tail -n 40 mobile-output/ios/test-output/vlc-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-output-ios
          path: mobile-output/ios
          if-no-files-found: warn
