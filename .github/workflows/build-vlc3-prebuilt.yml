name: build-vlc3-prebuilt

# Builds libvlc 3.0.x for every supported platform using PREBUILT dependencies
# (VideoLAN artifacts.videolan.org contrib bundles for cross targets where the
# toolchain matches; distro apt packages on Linux; source fallback otherwise)
# and uploads one artifact per RID (vlc3-prebuilt-<rid>).
#
# Trigger: workflow_dispatch with "only", or push to the branch with a commit
# message tag [build:<family>] / [build:all].

on:
  push:
    branches: [prebuilt-contribs]
    paths:
      - "prebuilt/**"
      - ".github/workflows/build-vlc3-prebuilt.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Platform family to build"
        type: choice
        default: all
        options: [all, windows, linux, apple, android]

concurrency:
  group: build-vlc3-prebuilt-${{ github.ref }}-${{ inputs.only || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VLC_VERSION: "3.0.23"

jobs:
  linux:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'linux'))
       || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build:linux]') || contains(github.event.head_commit.message, '[build:all]'))) }}
    # 22.04 ships FFmpeg 4.4 (VLC 3.0.23 builds against it) and an older glibc,
    # so the bundled runtime stays portable to newer consumers. arm/arm64 build
    # natively inside a QEMU-emulated ubuntu:22.04 container (same apt logic).
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  rid: linux-x64,   emulated: false, platform: "" }
          - { arch: aarch64, rid: linux-arm64, emulated: true,  platform: "linux/arm64" }
          - { arch: armv7,   rid: linux-arm,   emulated: true,  platform: "linux/arm/v7" }
    steps:
      - uses: actions/checkout@v5
      - name: Install build + prebuilt distro dependencies (native)
        if: ${{ !matrix.emulated }}
        run: sudo bash prebuilt/build/deps-linux.sh
      - name: Build (native ${{ matrix.arch }})
        if: ${{ !matrix.emulated }}
        run: bash prebuilt/build/build-linux.sh ${{ matrix.arch }}
      - name: Set up QEMU
        if: ${{ matrix.emulated }}
        uses: docker/setup-qemu-action@v3
      - name: Build (emulated ${{ matrix.arch }})
        if: ${{ matrix.emulated }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/work" -w /work ubuntu:22.04 \
            bash -c 'set -e; bash prebuilt/build/deps-linux.sh && bash prebuilt/build/build-linux.sh ${{ matrix.arch }}'
      - uses: actions/upload-artifact@v6
        with:
          name: vlc3-prebuilt-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  windows:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'windows'))
       || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build:windows]') || contains(github.event.head_commit.message, '[build:all]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  rid: win-x64 }
          - { arch: aarch64, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: Install cross build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autopoint libtool-bin pkg-config gettext \
            git bison flex nasm yasm cmake ninja-build meson zip p7zip-full \
            gperf help2man nsis dos2unix curl xz-utils zstd file
      - name: Build (${{ matrix.arch }})
        run: bash prebuilt/build/build-windows.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: vlc3-prebuilt-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  android:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'android'))
       || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build:android]') || contains(github.event.head_commit.message, '[build:all]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, rid: android-x64 }
          - { arch: arm64,  rid: android-arm64 }
          - { arch: arm,    rid: android-arm }
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autopoint libtool-bin pkg-config gettext \
            git bison flex nasm yasm cmake ninja-build meson curl xz-utils zstd unzip \
            gperf help2man
      - name: Resolve Android NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - name: Build (${{ matrix.arch }})
        run: bash prebuilt/build/build-android.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: vlc3-prebuilt-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  apple:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'apple'))
       || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build:apple]') || contains(github.event.head_commit.message, '[build:all]'))) }}
    runs-on: macos-14
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos,        arch: x86_64, rid: osx-x64 }
          - { platform: macos,        arch: arm64,  rid: osx-arm64 }
          - { platform: maccatalyst,  arch: x86_64, rid: maccatalyst-x64 }
          - { platform: maccatalyst,  arch: arm64,  rid: maccatalyst-arm64 }
          - { platform: ios,          arch: arm64,  rid: ios-arm64 }
          - { platform: iossimulator, arch: x86_64, rid: iossimulator-x64 }
          - { platform: iossimulator, arch: arm64,  rid: iossimulator-arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          brew install automake libtool pkg-config nasm yasm meson ninja gettext bison flex gperf help2man || true
          PY_USER_BIN="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts", "posix_user"))')"
          python3 -m pip install --user --break-system-packages 'cmake<3.29'
          export PATH="$PY_USER_BIN:$PATH"
          cmake --version
          echo "$PY_USER_BIN" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/gettext/bin:/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"
      - name: Build (${{ matrix.platform }}/${{ matrix.arch }})
        run: bash prebuilt/build/build-apple.sh ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: vlc3-prebuilt-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
