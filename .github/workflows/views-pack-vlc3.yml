name: views-pack-vlc3

# Packs the three VLCDotNet3.Playback view packages (Core, Avalonia, MAUI) and
# publishes them to a GitHub Release (tag vviews3-<version>). Runs on macOS so
# the Core mobile heads and the MAUI (android/ios/maccatalyst) heads build. The
# packages are managed-only; native libvlc is pulled transitively from the
# published VLCDotNet3.Playback package at consume time.

on:
  workflow_dispatch:
    inputs:
      playback_tag:
        description: "VLCDotNet3.Playback release tag the packages depend on"
        required: false
        default: "vplay3-3.0.24.6"
      publish_release:
        description: "Create/update a GitHub Release with the packages"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  pack:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode 26.0
        run: |
          for x in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app; do
            if [ -d "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              sudo xcode-select -s "$x/Contents/Developer"; echo "Selected $x"; break
            fi
          done

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install maui --version 10.0.100

      - name: Read VlcVersion
        id: ver
        run: |
          v=$(grep -oE '<VlcVersion>[^<]+' Directory.Build.props | sed 's/<VlcVersion>//')
          echo "vlc=$v" >> "$GITHUB_OUTPUT"

      - name: Resolve package and release version
        id: rel
        run: |
          set -euo pipefail
          base="${{ steps.ver.outputs.vlc }}"
          prefix="vviews3-${base}."
          git fetch --force --tags origin
          max_suffix=0
          for tag in $(git tag -l "${prefix}*"); do
            suffix="${tag#${prefix}}"
            case "$suffix" in ''|*[!0-9]*) continue ;; esac
            if [ "$suffix" -gt "$max_suffix" ]; then max_suffix="$suffix"; fi
          done
          next_suffix=$((max_suffix + 1))
          version="${base}.${next_suffix}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=vviews3-${version}" >> "$GITHUB_OUTPUT"
          echo "title=VLCDotNet3.Playback Views ${version}" >> "$GITHUB_OUTPUT"
          echo "Packing version $version"

      - name: Download VLCDotNet3.Playback into the local feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.playback_tag }}" --repo "${{ github.repository }}" --pattern '*.nupkg' -D Maui/.local-nuget

      - name: Pack VLCDotNet3.Playback.Core
        run: dotnet pack Maui/src/VLCDotNet.Core/VLCDotNet.Core.csproj -c Release -p:VlcMobileTargets=true -p:PackageVersion=${{ steps.rel.outputs.version }} -o out

      - name: Pack VLCDotNet3.Playback.Avalonia
        run: dotnet pack Maui/src/VLCDotNet.Avalonia/VLCDotNet.Avalonia.csproj -c Release -p:PackageVersion=${{ steps.rel.outputs.version }} -o out

      - name: Pack VLCDotNet3.Playback.Maui
        run: dotnet pack Maui/src/VLCDotNet.Maui/VLCDotNet.Maui.csproj -c Release -p:VlcMobileTargets=true -p:PackageVersion=${{ steps.rel.outputs.version }} -o out

      - name: List packages
        run: ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: VLCDotNet3-Playback-views-nupkg
          path: out/*.nupkg

      - name: Generate release notes
        if: ${{ inputs.publish_release }}
        id: notes
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/views-notes.md"
          {
            echo "# VLCDotNet3.Playback Views ${{ steps.rel.outputs.version }}"
            echo
            echo "High-level C# API and video views for the playback-only libvlc ${{ steps.ver.outputs.vlc }} runtimes."
            echo
            echo "## Packages"
            echo
            echo "- **VLCDotNet3.Playback.Core** - resource-safe LibVLC/Media/MediaPlayer/MediaList/Equalizer wrappers."
            echo "- **VLCDotNet3.Playback.Avalonia** - Avalonia \`VideoView\` (Windows/Linux/macOS hardware output, Android bitmap)."
            echo "- **VLCDotNet3.Playback.Maui** - .NET MAUI \`VideoView\` (iOS/Mac Catalyst VideoToolbox, Android bitmap)."
            echo
            echo "The packages are managed-only; native libvlc is pulled transitively from"
            echo "\`VLCDotNet3.Playback\` (${{ inputs.playback_tag }}). Add that package and these to a local"
            echo "folder feed (NuGet.config) to consume them."
          } > "$notes_file"
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"
          cat "$notes_file"

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          title="${{ steps.rel.outputs.title }}"
          notes_file="${{ steps.notes.outputs.file }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.nupkg --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$tag" out/*.nupkg --title "$title" --notes-file "$notes_file" --prerelease
          fi
